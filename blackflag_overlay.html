<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Black Flag Stream Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif; 
            color: #ffffff;
            user-select: none; 
        }

        body {
            width: 1920px;
            height: 1080px;
            background-color: transparent;
            position: relative;
            overflow: hidden;
        }

        /* --- THEMED WEBCAM FRAME --- */
        .webcam-container {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 40px;
            width: 426px; 
            height: 240px;
            
            
            border: 2px solid #750b0b; 
            border-bottom: 3px solid #5a0707;
            box-shadow: 0 12px 25px rgba(0,0,0,0), 0 0 15px rgba(117,11,11,0.3), inset 0 0 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .webcam-label {
            position: absolute;
            top: -27px;
            left: -2px;
            
            background: linear-gradient(to bottom, #8a1010, #5a0707); 
            border: 1px solid #a61717;
            border-bottom: none;
            
            color: #f0f0f0; 
            padding: 4px 16px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 4px 4px 0 0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.6);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* --- STATS BAR (Under Webcam) --- */
        .stats-bar {
            position: absolute;
            top: calc(50% + 140px); 
            right: 40px;
            width: 426px; 
            
            display: flex;
            justify-content: space-evenly; /* Spreads them perfectly */
            align-items: center;
            
            /* Frosted gradient background */
            background: linear-gradient(to right, rgba(10, 10, 12, 0.85), rgba(25, 15, 15, 0.9), rgba(10, 10, 12, 0.85));
            backdrop-filter: blur(6px); /* Blurs the game behind the stats */
            
            border: 2px solid #750b0b; 
            border-top: 1px solid #a61717; /* Highlighted top edge to catch the 'light' */
            border-radius: 6px; 
            padding: 10px 0;
            
            box-shadow: 0 8px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.6);
        }

        /* HUD Divider line between the two stats */
        .stats-divider {
            height: 45px;
            width: 2px;
            background: linear-gradient(to bottom, transparent, #750b0b, transparent);
            box-shadow: 0 0 5px rgba(166, 23, 23, 0.5);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 45%;
            justify-content: center;
        }

        .stat-icon {
            font-size: 24px;
            filter: drop-shadow(0 0 6px rgba(166, 23, 23, 0.7)); /* Makes emojis glow cleanly */
        }

        .stat-text-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .stat-label {
            font-size: 12px;
            color: #ffffff;
            font-variant: small-caps; /* Gives it a classic, elegant look */
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
            margin-bottom: 1px;
            margin-top: 7px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: bold;
            color: #a61717; 
            font-family: 'Courier New', Courier, monospace; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(117,11,11,0.5); /* Ambient red glow */
            transition: transform 0.1s;
        }

        @keyframes flashRed {
            0% { color: #a61717; text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(117,11,11,0.5); }
            50% { color: #ff3333; text-shadow: 0 0 25px #ff3333, 0 0 10px #ff3333; transform: scale(1.15); }
            100% { color: #a61717; text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(117,11,11,0.5); transform: scale(1); }
        }
        
        .flash {
            animation: flashRed 0.6s ease-out;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="webcam-container" id="webcam-frame">
        <div class="webcam-label">theFunkySoul</div>
    </div>

    <div class="stats-bar" id="stats-bar">
        <div class="stat-item">
            <span class="stat-icon">⏳</span>
            <div class="stat-text-container">
                <div class="stat-label" >TIME PLAYED</div>
                <div class="stat-value" id="timer-display">00:00:00</div>
            </div>
        </div>
        
        <div class="stats-divider"></div>
        
        <div class="stat-item">
            <span class="stat-icon">☠️</span>
            <div class="stat-text-container">
                <div class="stat-label">DESYNCS</div> 
                <div class="stat-value" id="death-display">0</div>
            </div>
        </div>
    </div>

    <script>
        const timerDisplay = document.getElementById('timer-display');
        const deathDisplay = document.getElementById('death-display');
        const statsBar = document.getElementById('stats-bar');
        const webcamFrame = document.getElementById('webcam-frame');
        
        let currentDeaths = -1; 

        function updateOverlay() {
            const script = document.createElement('script');
            script.src = 'data.js?cache_bypass=' + Date.now();
            
            script.onload = function() {
                if (typeof overlayData !== 'undefined') {
                    
                    // Update Visibility
                    if (overlayData.show_topbar !== false) {
                        statsBar.style.display = "flex";
                    } else {
                        statsBar.style.display = "none";
                    }

                    if (overlayData.show_webcam !== false) {
                        webcamFrame.style.display = "block";
                    } else {
                        webcamFrame.style.display = "none";
                    }

                    // Update Timer
                    timerDisplay.innerText = overlayData.timer_string;
                    if (overlayData.is_running) {
                        timerDisplay.style.color = "#a61717";
                    } else {
                        timerDisplay.style.color = "#777777";
                    }

                    // Update Deaths & Trigger Flash if increased
                    if (currentDeaths !== -1 && overlayData.deaths > currentDeaths) {
                        deathDisplay.classList.remove('flash');
                        void deathDisplay.offsetWidth; 
                        deathDisplay.classList.add('flash');
                    }
                    deathDisplay.innerText = overlayData.deaths;
                    currentDeaths = overlayData.deaths;
                }
                
                document.head.removeChild(script);
            };

            document.head.appendChild(script);
        }

        setInterval(updateOverlay, 1000);
        updateOverlay();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Black Flag Stream Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif; 
            color: #ffffff;
            user-select: none; 
        }

        body {
            width: 1920px;
            height: 1080px;
            background-color: transparent;
            position: relative;
            overflow: hidden;
        }

        /* Webcam frame */
        .webcam-container {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 40px;
            width: 424px; 
            height: 240px;
            
            box-shadow: 0 12px 25px rgba(0,0,0,0), 0 0 15px rgba(117,11,11,0.3), inset 0 0 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .webcam-container::before {
            content: "";
            position: absolute;
            inset: -2px; 
            border-radius: 4px;
            padding: 2px; 
            
            background: conic-gradient(from var(--angle), #3a0404 0%, #5a0707 85%, #ac0e0e 100%);

            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            
            animation: spin-saber 12s linear infinite;
            z-index: -1;
        }

        .webcam-label {
            position: absolute;
            top: -26px;
            left: -2px;
            
            background: linear-gradient(to bottom, #8a1010, #5a0707); 
            border: 1px solid #a61717;
            border-bottom: none;
            
            color: #f0f0f0; 
            padding: 4px 16px 4px 8px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 4px 4px 0 0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.6);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /*  STATS BAR  */
        .stats-bar {
            position: absolute;
            top: calc(50% + 126px); 
            right: 38px;
            width: 430px; 
            
            display: flex;
            justify-content: space-evenly; 
            align-items: center;
            
            background: linear-gradient(to right, rgba(0, 0, 0, 0.95), rgba(5, 0, 0, 0.9), rgba(10, 10, 12, 0.95));
            backdrop-filter: blur(6px);
            
            border: 2px solid #750b0b; 
            border-top: 1px solid #a61717; 
            border-radius: 6px; 
            padding: 10px 0;
            
            box-shadow: 0 8px 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.6);
        }

        .stats-divider {
            height: 45px;
            width: 2px;
            background: linear-gradient(to bottom, transparent, #ff0000, transparent);
            box-shadow: 0 0 5px rgba(166, 23, 23, 0.5);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 45%;
            justify-content: center;
        }

        .stat-icon {
            font-size: 24px;
            filter: drop-shadow(0 0 6px rgba(166, 23, 23, 0.7)); /* Makes emojis glow cleanly */
        }

        .stat-text-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .stat-label {
            font-size: 12px;
            color: #ffffff;
            font-variant: small-caps; /* Gives it a classic, elegant look */
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
            margin-bottom: 1px;
            margin-top: 7px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: bold;
            color: #ff0000; 
            font-family: 'Courier New', Courier, monospace; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(255, 0, 0, 0.5); /* Ambient red glow */
            transition: transform 0.1s;
        }

        /* OBJECTIVE BAR */
        .objective-bar {
            position: absolute;
            top: 745px;
            right: 38px;
            width: 430px; 
            
            display: none;
            justify-content: flex-start;
            align-items: center;
            padding: 10px 15px;
            
            background: rgba(15, 15, 18, 0.95);
            border: 2px solid #750b0b; 
            border-radius: 6px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .objective-text {
            font-size: 16px;
            color: #ffffff;
            font-variant: small-caps;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
            text-align: left;
            display: flex;
            align-items: center;
        }

        .objective-icon {
            font-size: 14px;
            margin-right: 6px;
        }

        .objective-prefix {
            font-size: 14px;
            color: #ffffff;
            margin-right: 8px;
        }

        
        .ac-logo {
            height: 14px; 
            width: auto;
            vertical-align: top;
            margin-right: 1px; 
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.8)); 
        }

        @keyframes flashRed {
            0% { color: #a61717; text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(117,11,11,0.5); }
            50% { color: #ff3333; text-shadow: 0 0 25px #ff3333, 0 0 10px #ff3333; transform: scale(1.15); }
            100% { color: #a61717; text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 8px rgba(117,11,11,0.5); transform: scale(1); }
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes spin-saber {
            from { --angle: 0deg; }
            to { --angle: 360deg; }
        }

        .stat-item, .stats-divider {
            position: relative;
            z-index: 2;
        }

        /* ANIMUS PARTICLES */
        .particle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%;
            pointer-events: none; 
            overflow: hidden; 
            z-index: 1; 
            border-radius: 4px;
        }

        .animus-particle {
            position: absolute;
            bottom: -15px; 
            width: 2px;
            border-radius: 1px;
            opacity: 0;
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 0.6; } 
            80% { opacity: 0.6; }
            100% { transform: translateY(-90px); opacity: 0; } 
        }
        
        .flash {
            animation: flashRed 0.6s ease-out;
            display: inline-block;
        }
    </style>
</head>
<body>

    

    <div class="webcam-container" id="webcam-frame">
        <div class="webcam-label">
            <img src="ac_logo.png" class="ac-logo">
            theFunkySoul
        </div>
    </div>

    

    <div class="stats-bar" id="stats-bar">

        <div class="particle-container" id="particle-container"></div>

        <div class="stat-item">
            <span class="stat-icon">⏳</span>
            <div class="stat-text-container">
                <div class="stat-label" >TIME PLAYED</div>
                <div class="stat-value" id="timer-display">00:00:00</div>
            </div>
        </div>
        
        <div class="stats-divider"></div>
        
        <div class="stat-item">
            <span class="stat-icon">☠️</span>
            <div class="stat-text-container">
                <div class="stat-label">DESYNCS</div> 
                <div class="stat-value" id="death-display">0</div>
            </div>
        </div>
    </div>

    <div class="objective-bar" id="objective-bar">
        <div class="objective-text">
            <span class="objective-prefix"></span>
            <span id="objective-display"></span>
        </div>
    </div>

    <script>
        const timerDisplay = document.getElementById('timer-display');
        const deathDisplay = document.getElementById('death-display');
        const statsBar = document.getElementById('stats-bar');
        const webcamFrame = document.getElementById('webcam-frame');
        const objectiveBar = document.getElementById('objective-bar');
        const objectiveDisplay = document.getElementById('objective-display');
        
        let currentDeaths = -1; 
        let currentSeconds = -1;

        function spawnAnimusParticles() {
            const container = document.getElementById('particle-container');
            const particleCount = 12; 

            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement('div');
                particle.classList.add('animus-particle');

                let startPosX = Math.random() * 100;    
                let duration = Math.random() * 2.5 + 2; 
                let delay = Math.random() * 5; 
                let size = Math.random() * 20 + 5; 

                particle.style.left = startPosX + '%';
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';
                particle.style.height = size + 'px';

                particle.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
                particle.style.boxShadow = '0 0 5px rgba(255, 255, 255, 0.4)';

                container.appendChild(particle);
            }
        }
        
        spawnAnimusParticles();

        function updateOverlay() {
            const script = document.createElement('script');
            script.src = 'data.js?cache_bypass=' + Date.now();
            
            script.onload = function() {
                if (typeof overlayData !== 'undefined') {
                    
                    // Update Visibility
                    if (overlayData.show_topbar !== false) {
                        statsBar.style.display = "flex";
                    } else {
                        statsBar.style.display = "none";
                    }

                    if (overlayData.show_webcam !== false) {
                        webcamFrame.style.display = "block";
                    } else {
                        webcamFrame.style.display = "none";
                    }

                    // Update Objective
                    if (overlayData.current_objective && overlayData.current_objective.trim() !== "") {
                        objectiveDisplay.innerText = overlayData.current_objective;
                        if (overlayData.show_objective !== false) {
                            objectiveBar.style.display = "flex";
                        } else {
                            objectiveBar.style.display = "none";
                        }
                    } else {
                        objectiveBar.style.display = "none";
                    }

                    
                    timerDisplay.innerText = overlayData.timer_string;
                    if (overlayData.is_running) {
                        timerDisplay.style.color = "#ff0000";
                    } else {
                        timerDisplay.style.color = "#777777";
                    }

                    
                    if (currentDeaths !== -1 && overlayData.deaths > currentDeaths) {
                        deathDisplay.classList.remove('flash');
                        void deathDisplay.offsetWidth; 
                        deathDisplay.classList.add('flash');
                    }
                    deathDisplay.innerText = overlayData.deaths;
                    currentDeaths = overlayData.deaths;

                    
                    if (currentSeconds !== -1 && overlayData.timer_seconds > currentSeconds) {
                        if (overlayData.timer_seconds % 60 === 0 && overlayData.timer_seconds > 0) {
                            timerDisplay.classList.remove('flash');
                            void timerDisplay.offsetWidth; // Force a DOM reflow
                            timerDisplay.classList.add('flash');
                        }
                    }
                    currentSeconds = overlayData.timer_seconds;
                }
                
                document.head.removeChild(script);
            };

            document.head.appendChild(script);
        }

        setInterval(updateOverlay, 1000);
        updateOverlay();
    </script>
</body>
</html>
